# Netlify: the Next.js app lives in web/.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_MODE = "live"

# The EC2 backend (deploy/README.md); the browser only talks to Netlify, so no CORS.
[[redirects]]
  from = "/api/*"
  to = "https://32-236-205-232.sslip.io/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://32-236-205-232.sslip.io/admin/:splat"
  status = 200
  force = true
